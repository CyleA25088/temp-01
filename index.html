<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <style>
        :root {
            --border-width: 5px;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #b7b7b7;
            margin: 0;
        }

        #container {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 650px;
        }

        /* --- TAB NAVIGATION --- */
        .tab-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 650px;
            height: 30px;
            z-index: -1;
            padding: 0 20px;
        }

        .tab-group {
            display: flex;
            justify-content: center;
            gap: 4px;
            height: 30px;
        }

        .tab {
            height: 30px;
            width: 65px;
            background: #DDE6CB;
            display: flex;
            justify-content: center;
            cursor: pointer;
            border: var(--border-width) solid #F4FAEC;
            border-bottom: 0;
            color: rgba(0, 0, 0, 0.58);
            padding-top: 5px;
            box-shadow: 0 0 0 2px rgba(0, 0, 0, 0.35);
            position: relative;
        }

        .tab.active {
            height: calc(var(--border-width) + 30px);
            z-index: 10;
            box-shadow: none;
            color: rgba(0, 0, 0, 0.85);
        }

        .tab.active::after {
            content: '';
            position: absolute;
            top: calc(-1 * var(--border-width) - 2px);
            left: calc(-1 * var(--border-width) - 2px);
            right: calc(-1 * var(--border-width) - 2px);
            bottom: var(--border-width);
            border: 2px solid rgba(0, 0, 0, 0.35);
            border-bottom: none;
            pointer-events: none;
            box-sizing: border-box;
        }

        .tab.bomb {
            background-color: #60B3D7;
        }

        .tab.monster {
            background-color: #C46564;
        }

        .tab.star {
            background-color: #EABF59;
        }

        /* --- CARDS CONTAINER --- */
        .cards {
            background: #DDE6CB;
            border: var(--border-width) solid #F4FAEC;
            border-bottom: 0;
            width: 650px;
            height: 155px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            gap: 10px;
            position: relative;
            z-index: 5;
            box-shadow: 5px -5px 2px 0px rgba(0, 0, 0, 0.5);
            border-radius: 10px 10px 0 0;
            padding: 10px;
        }

        .card {
            width: 110px;
            height: 110px;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: var(--color);
            overflow: visible;
        }

        .cards .card:nth-child(1n) {
            --color: #BBCFB6;
        }

        .cards .card:nth-child(2n) {
            --color: #C7CEAC;
        }

        /* Badge Pill */
        .ammount {
            min-width: 24px;
            height: 24px;
            padding: 0 4px;
            color: white;
            font-size: 12px;
            font-weight: bold;
            border-radius: 11px;
            border: 2px solid var(--color);
            background: #585953;
            position: absolute;
            left: 0;
            top: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 2;
        }

        /* Icon Top Region */
        .icon {
            width: 100%;
            height: 65%;
            position: relative;
        }

        .icon img {
            width: 100%;
            height: auto;
            position: absolute;
            bottom: 0;
            left: 0;
            object-fit: contain;
        }

        /* Buy Pill Button */
        .buy {
            background: #8FA85B;
            border: 2px solid #5F7435;
            border-radius: 6px;
            padding: 3px 10px 3px 8px;
            align-items: center;
            gap: 6px;
            color: white;
            font-weight: bold;
            font-size: 13px;
            box-shadow: inset 0 2px 4px rgba(255, 255, 255, 0.3);
            cursor: pointer;
            margin-bottom: 10px;
            width: 78%;
            display: flex;
            flex-direction: row;
            justify-content: space-between;
        }

        .buy i {
            text-shadow: -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000;
            font-size: 14px;
            color: #F4FAEC;
        }

        /* Navigation Arrows */
        .arrow {
            height: 110px;
            display: flex;
            align-items: center;
            font-size: 23px;
            color: rgba(70, 73, 59, 0.42);
        }

        .arrow.active {
            color: rgba(0, 0, 0, 0.62);
        }
    </style>
</head>
<body>
    <div id="container">
        <div class="tab-container">
            <div class="tab-group">
                <div class="tab star"><i class="fa-solid fa-star"></i></div>
            </div>
            <div class="tab-group">
                <div class="tab active"><i class="fa-solid fa-house"></i></div>
                <div class="tab"><i class="fa-solid fa-coins"></i></div>
                <div class="tab"><i class="fa-solid fa-shield-halved"></i></div>
                <div class="tab"><i class="fa-solid fa-road"></i></div>
                <div class="tab bomb"><i class="fa-solid fa-bomb"></i></div>
            </div>
            <div class="tab-group">
                <div class="tab monster"><i class="fa-solid fa-dragon"></i></div>
            </div>
        </div>

        <div class="cards">
            <i class="arrow left fa-solid fa-circle-left"></i>

            <div class="card">
                <div class="ammount">0</div>
                <div class="icon">
                    <img src="./house.png" alt="House">
                </div>
                <div class="buy">
                    <i class="fa-solid fa-coins"></i>
                    <span>600</span>
                </div>
            </div>

            <div class="card">
                <div class="ammount">0</div>
                <div class="icon">
                    <img src="./house.png" alt="House">
                </div>
                <div class="buy">
                    <i class="fa-solid fa-coins"></i>
                    <span>600</span>
                </div>
            </div>

            <div class="card">
                <div class="ammount">0</div>
                <div class="icon">
                    <img src="./house.png" alt="House">
                </div>
                <div class="buy">
                    <i class="fa-solid fa-coins"></i>
                    <span>600</span>
                </div>
            </div>

            <div class="card">
                <div class="ammount">0</div>
                <div class="icon">
                    <img src="./house.png" alt="House">
                </div>
                <div class="buy">
                    <i class="fa-solid fa-coins"></i>
                    <span>600</span>
                </div>
            </div>

            <div class="card">
                <div class="ammount">0</div>
                <div class="icon">
                    <img src="./house.png" alt="House">
                </div>
                <div class="buy">
                    <i class="fa-solid fa-coins"></i>
                    <span>600</span>
                </div>
            </div>

            <i class="arrow right fa-solid fa-circle-right"></i>
        </div>
    </div>

    <script>
        const tabs = document.querySelectorAll('.tab');

        tabs.forEach(tab => {
            tab.addEventListener('click', () => {
                const currentActive = document.querySelector('.tab.active');
                if (currentActive) {
                    currentActive.classList.remove('active');
                }
                tab.classList.add('active');
            });
        });
    </script>
</body>
</html>
